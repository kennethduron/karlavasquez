name: Quality and security

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - feat/knv-firebase-auth-infrastructure-phase-1
      - feat/knv-public-site-phase-2
      - feat/knv-public-site-polish-phase-2-1
      - feat/knv-public-site-polish-phase-2-2
      - feat/knv-final-brand-photo-phase-2-3
      - feat/knv-infrastructure-setup-phase-2-4a
      - feat/knv-production-cutover-phase-2-4b

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      - run: supabase start
      - run: supabase db reset --local
      - run: npm run supabase:lint
      - run: npm run test:supabase:rls
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run security:check
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - run: npm run test:e2e

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
